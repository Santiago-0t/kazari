name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy -p kazari-core --all-targets -- -D warnings
      - run: cargo test -p kazari-core

  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p kazari-core
      - run: cargo build --release -p kazari
      - uses: actions/upload-artifact@v4
        with:
          name: kazari-windows
          path: target/release/kazari.exe
